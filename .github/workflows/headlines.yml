name: Hourly live update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and log live update
        run: python fetch_headline.py
      - name: Retain JSON log
        uses: actions/upload-artifact@v4
        with:
          name: live-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/headlines.jsonl
          if-no-files-found: error
          retention-days: 30
