name: Python pricing demo
on:
  workflow_dispatch:
    inputs:
      price_date:
        description: 'One past trading date (YYYY-MM-DD)'
        required: true
        type: string
      symbols:
        description: 'Space-separated Yahoo symbols (maximum 5)'
        required: true
        default: 'AAPL MSFT SPY'
        type: string
permissions:
  contents: read
concurrency:
  group: pricing-demo
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parsing and run behavior
        run: python -m unittest discover -s pricing_demo -v
      - name: Fetch, save, and verify one date
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PRICE_DATE: ${{ inputs.price_date }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          python - <<'PY'
          import os
          import shlex
          import subprocess
          import sys
          subprocess.run([
              sys.executable, 'pricing_demo/ingest.py',
              '--date', os.environ['PRICE_DATE'],
              '--output', 'pricing-result.json',
              '--symbols', *shlex.split(os.environ['SYMBOLS']),
          ], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-demo-result
          path: pricing-result.json
          if-no-files-found: ignore
          retention-days: 7
